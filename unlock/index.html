<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Unlock Pattern | ALBA STUDIO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      width: 100%;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(6px);
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00aaff;
      text-transform: uppercase;
    }

    .back-btn {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-size: 12px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #00aaff; }

    /* ── Main ────────────────────────────────────────────────────────────────── */
    .container {
      width: 100%;
      max-width: 440px;
      padding: 28px 20px 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ── Status ──────────────────────────────────────────────────────────────── */
    .status-wrap {
      width: 100%;
      max-width: 320px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-pill {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.45);
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .status-pill.s-new {
      background: rgba(0, 255, 136, 0.12);
      border-color: rgba(0, 255, 136, 0.4);
      color: #00ff88;
    }
    .status-pill.s-dup {
      background: rgba(255, 68, 102, 0.12);
      border-color: rgba(255, 68, 102, 0.4);
      color: #ff4466;
    }
    .status-pill.s-gen {
      background: rgba(255, 170, 0, 0.12);
      border-color: rgba(255, 170, 0, 0.4);
      color: #ffaa00;
    }
    .status-pill.s-dis {
      background: rgba(255, 170, 0, 0.12);
      border-color: rgba(255, 170, 0, 0.4);
      color: #ffaa00;
    }

    /* ── Canvas ──────────────────────────────────────────────────────────────── */
    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #patternCanvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      cursor: crosshair;
    }

    /* ── Buttons ─────────────────────────────────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }

    .btn {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none !important; }

    .btn-register {
      background: linear-gradient(90deg, #00ff88, #00aaff);
      color: #000;
    }
    .btn-register:not(:disabled):hover { box-shadow: 0 0 14px rgba(0, 255, 136, 0.4); }

    .btn-generate {
      background: rgba(255, 170, 0, 0.15);
      color: #ffaa00;
      border: 1px solid rgba(255, 170, 0, 0.3);
    }
    .btn-generate:not(:disabled):hover { background: rgba(255, 170, 0, 0.25); }

    .btn-clear {
      background: rgba(255, 68, 102, 0.1);
      color: #ff4466;
      border: 1px solid rgba(255, 68, 102, 0.25);
    }
    .btn-clear:hover { background: rgba(255, 68, 102, 0.2); }

    .btn-discard {
      background: rgba(180, 60, 20, 0.15);
      color: #ff7744;
      border: 1px solid rgba(180, 60, 20, 0.35);
    }
    .btn-discard:hover { background: rgba(180, 60, 20, 0.28); }

    /* ── Stats bar ───────────────────────────────────────────────────────────── */
    .stats-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(5, 5, 18, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 16px 12px;
      z-index: 100;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      transition: transform 0.15s, color 0.3s;
    }
    .stat-num.bump {
      transform: scale(1.25);
    }

    .stat-label {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .c-reg { color: #00ff88; }
    .c-dis { color: #ffaa00; }
    .c-rem { color: #00aaff; }
  </style>
</head>
<body>

<header>
  <span class="header-title">Unlock Pattern</span>
  <a href="../index.html" class="back-btn">← Volver</a>
</header>

<div class="container">
  <div class="status-wrap">
    <span class="status-pill" id="statusPill">Dibuja un patrón · mínimo 4 puntos</span>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="patternCanvas"></canvas>
  </div>

  <div class="btn-row">
    <button class="btn btn-register" id="btnRegister" disabled>Registrar</button>
    <button class="btn btn-generate" id="btnGenerate">Generar parecido</button>
    <button class="btn btn-discard" id="btnDiscard" style="display:none">Descartar</button>
    <button class="btn btn-clear" id="btnClear">Limpiar</button>
  </div>

  </div>

<footer class="stats-bar">
  <div class="stat">
    <span class="stat-num c-reg" id="statReg">0</span>
    <span class="stat-label">Registrados</span>
  </div>
  <div class="stat">
    <span class="stat-num c-dis" id="statDis">0</span>
    <span class="stat-label">Descartados</span>
  </div>
  <div class="stat">
    <span class="stat-num c-rem" id="statRem">—</span>
    <span class="stat-label">Restantes</span>
  </div>
</footer>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
const STORAGE_KEY  = 'alba_unlock_patterns';
const DISCARD_KEY  = 'alba_unlock_discarded';
const MIN_DOTS     = 4;

const COLORS = {
  bg:          '#0d0d1a',
  dotFill:     'rgba(255,255,255,0.10)',
  dotRing:     'rgba(0,170,255,0.35)',
  lineIdle:    'rgba(0,170,255,0.45)',
  lineNew:     'rgba(0,255,136,0.55)',
  lineDup:     'rgba(255,68,102,0.55)',
  lineGen:     'rgba(255,170,0,0.55)',
  dotActive:   '#00aaff',
  dotNew:      '#00ff88',
  dotDup:      '#ff4466',
  dotGen:      '#ffaa00',
  liveTrail:   'rgba(0,170,255,0.2)',
  numIdle:     'rgba(255,255,255,0.28)',
  numActive:   '#000',
};

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let history    = [];
let discarded  = [];
let current    = [];       // dot indices 0-8 in draw order
let drawing    = false;
let phase      = 'idle';   // idle | drawing | new | dup | gen | registered
let cursorPos  = null;
let canvasSize = 0;

// ═══════════════════════════════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════════════════════════════
const canvas    = document.getElementById('patternCanvas');
const ctx       = canvas.getContext('2d');
const wrap      = document.getElementById('canvasWrap');
const pill      = document.getElementById('statusPill');
const btnReg    = document.getElementById('btnRegister');
const btnGen    = document.getElementById('btnGenerate');
const btnDis    = document.getElementById('btnDiscard');
const btnClr    = document.getElementById('btnClear');
const statReg   = document.getElementById('statReg');
const statDis   = document.getElementById('statDis');
const statRem   = document.getElementById('statRem');

// ═══════════════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════════════
function loadHistory() {
  try { history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { history = []; }
  try { discarded = JSON.parse(localStorage.getItem(DISCARD_KEY)) || []; }
  catch { discarded = []; }
}

function savePattern(pat) {
  history.push([...pat]);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  updateCounters();
}

function discardPattern(pat) {
  discarded.push([...pat]);
  localStorage.setItem(DISCARD_KEY, JSON.stringify(discarded));
  updateCounters();
}

function patternKey(pat) { return pat.join('-'); }
function isDuplicate(pat) {
  const k = patternKey(pat);
  return history.some(h => patternKey(h) === k);
}
function isDiscarded(pat) {
  const k = patternKey(pat);
  return discarded.some(d => patternKey(d) === k);
}

// ═══════════════════════════════════════════════════════════════════
// GEOMETRY  (dots 0-8, col=i%3, row=floor(i/3))
// ═══════════════════════════════════════════════════════════════════
function dotCenter(idx) {
  const margin = canvasSize * 0.16;
  const step   = (canvasSize - margin * 2) / 2;
  return {
    x: margin + (idx % 3) * step,
    y: margin + Math.floor(idx / 3) * step,
  };
}

const dotR    = () => canvasSize * 0.054;
const hitR    = () => canvasSize * 0.092;

function nearestDot(x, y) {
  const hr = hitR();
  for (let i = 0; i < 9; i++) {
    const c = dotCenter(i);
    if ((x - c.x) ** 2 + (y - c.y) ** 2 < hr * hr) return i;
  }
  return -1;
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function render() {
  const s = canvasSize;
  ctx.clearRect(0, 0, s, s);

  // Background card
  ctx.fillStyle = COLORS.bg;
  roundRect(ctx, 0, 0, s, s, s * 0.05);
  ctx.fill();

  // Subtle grid dots (all 9) as background hints
  for (let i = 0; i < 9; i++) {
    const p = dotCenter(i);
    // faint cross guide
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.x - s * 0.04, p.y);
    ctx.lineTo(p.x + s * 0.04, p.y);
    ctx.moveTo(p.x, p.y - s * 0.04);
    ctx.lineTo(p.x, p.y + s * 0.04);
    ctx.stroke();
  }

  // Line color based on phase
  let lineCol = COLORS.lineIdle;
  if (phase === 'new' || phase === 'registered') lineCol = COLORS.lineNew;
  if (phase === 'dup')  lineCol = COLORS.lineDup;
  if (phase === 'gen' || phase === 'dis')  lineCol = COLORS.lineGen;

  // Draw path lines
  if (current.length > 1) {
    ctx.beginPath();
    ctx.strokeStyle = lineCol;
    ctx.lineWidth   = s * 0.026;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    const s0 = dotCenter(current[0]);
    ctx.moveTo(s0.x, s0.y);
    for (let i = 1; i < current.length; i++) {
      const p = dotCenter(current[i]);
      ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  // Live trailing line to cursor
  if (drawing && cursorPos && current.length > 0) {
    const last = dotCenter(current[current.length - 1]);
    ctx.beginPath();
    ctx.strokeStyle = COLORS.liveTrail;
    ctx.lineWidth   = s * 0.018;
    ctx.lineCap     = 'round';
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(cursorPos.x, cursorPos.y);
    ctx.stroke();
  }

  // Draw dots
  const r = dotR();
  for (let i = 0; i < 9; i++) {
    const p       = dotCenter(i);
    const active  = current.includes(i);

    let dotColor = COLORS.dotActive;
    if (phase === 'new' || phase === 'registered') dotColor = COLORS.dotNew;
    if (phase === 'dup')  dotColor = COLORS.dotDup;
    if (phase === 'gen' || phase === 'dis')  dotColor = COLORS.dotGen;

    // Outer glow ring for active dots
    if (active) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 1.55, 0, Math.PI * 2);
      ctx.strokeStyle = dotColor;
      ctx.lineWidth   = s * 0.014;
      ctx.globalAlpha = 0.55;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Idle ring (always visible)
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 1.2, 0, Math.PI * 2);
    ctx.strokeStyle = active ? dotColor : COLORS.dotRing;
    ctx.lineWidth   = s * 0.008;
    ctx.stroke();

    // Filled dot
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = active ? dotColor : COLORS.dotFill;
    ctx.fill();

    // Number label
    ctx.fillStyle    = active ? COLORS.numActive : COLORS.numIdle;
    ctx.font         = `700 ${Math.round(s * 0.03)}px 'Segoe UI', sans-serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(i + 1, p.x, p.y);
  }

  // Order numbers along path
  if (current.length > 0) {
    ctx.font      = `600 ${Math.round(s * 0.022)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let dotColor = COLORS.dotActive;
    if (phase === 'new' || phase === 'registered') dotColor = COLORS.dotNew;
    if (phase === 'dup')  dotColor = COLORS.dotDup;
    if (phase === 'gen' || phase === 'dis')  dotColor = COLORS.dotGen;

    current.forEach((idx, order) => {
      if (order === 0) return;
      const p = dotCenter(idx);
      const ox = p.x + r * 1.9;
      const oy = p.y - r * 1.9;
      ctx.fillStyle = dotColor;
      ctx.globalAlpha = 0.75;
      ctx.fillText(order + 1, ox, oy);
      ctx.globalAlpha = 1;
    });
  }
}

// ── roundRect polyfill ─────────────────────────────────────────────
function roundRect(c, x, y, w, h, r) {
  if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// ═══════════════════════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════════════════════
function resize() {
  canvasSize      = wrap.clientWidth;
  canvas.width    = canvasSize;
  canvas.height   = canvasSize;
  render();
}

// ═══════════════════════════════════════════════════════════════════
// STATUS PILL
// ═══════════════════════════════════════════════════════════════════
function setStatus(text, type) {
  pill.textContent  = text;
  pill.className    = 'status-pill' + (type ? ' s-' + type : '');
}

// ═══════════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════════
function evPos(e) {
  const rect  = canvas.getBoundingClientRect();
  const scale = canvasSize / rect.width;
  const src   = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scale,
    y: (src.clientY - rect.top)  * scale,
  };
}

function onStart(e) {
  e.preventDefault();
  if (phase !== 'idle' && phase !== 'drawing') reset(false);
  const pos = evPos(e);
  const hit = nearestDot(pos.x, pos.y);
  if (hit === -1) return;
  drawing    = true;
  phase      = 'drawing';
  current    = [hit];
  cursorPos  = pos;
  btnReg.disabled = true;
  syncButtons();
  setStatus('Dibujando…', null);
  render();
}

function onMove(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = evPos(e);
  cursorPos = pos;
  const hit = nearestDot(pos.x, pos.y);
  if (hit !== -1 && !current.includes(hit)) current.push(hit);
  render();
}

function onEnd(e) {
  if (!drawing) return;
  e.preventDefault();
  drawing   = false;
  cursorPos = null;

  if (current.length < MIN_DOTS) {
    setStatus(`Mínimo ${MIN_DOTS} puntos — inténtalo de nuevo`, null);
    current = [];
    phase   = 'idle';
    btnReg.disabled = true;
    render();
    return;
  }

  if (isDuplicate(current)) {
    phase = 'dup';
    setStatus('Patrón ya registrado', 'dup');
    btnReg.disabled = true;
  } else if (isDiscarded(current)) {
    phase = 'dis';
    setStatus('Patrón descartado previamente', 'dis');
    btnReg.disabled = true;
  } else {
    phase = 'new';
    setStatus('¡Patrón nuevo!  Puedes registrarlo', 'new');
    btnReg.disabled = false;
  }
  syncButtons();
  render();
}

// ═══════════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════════
function syncButtons() {
  const isGen = phase === 'gen';
  btnGen.style.display = isGen ? 'none'  : '';
  btnDis.style.display = isGen ? ''      : 'none';
}

function reset(full = true) {
  current    = [];
  drawing    = false;
  cursorPos  = null;
  phase      = 'idle';
  btnReg.disabled = true;
  syncButtons();
  if (full) setStatus('Dibuja un patrón · mínimo 4 puntos', null);
  render();
}

btnClr.addEventListener('click', () => reset());

btnReg.addEventListener('click', () => {
  if (current.length < MIN_DOTS) return;
  if (phase !== 'new' && phase !== 'gen') return;
  savePattern(current);
  phase = 'registered';
  setStatus(`Patrón registrado (${current.length} puntos)`, 'new');
  btnReg.disabled = true;
  syncButtons();
  render();
});

btnDis.addEventListener('click', () => {
  if (phase !== 'gen' || current.length < MIN_DOTS) return;
  discardPattern(current);
  reset();
  setStatus('Patrón descartado · no volverá a generarse', null);
});

// ═══════════════════════════════════════════════════════════════════
// ADJACENCY RULE  (0-indexed; user's 1-9 minus 1)
// ═══════════════════════════════════════════════════════════════════
const ADJACENCY = [
  [1,3,4],             // 0 = dot 1
  [0,2,3,4,5],         // 1 = dot 2
  [1,4,5],             // 2 = dot 3
  [0,1,4,6,7],         // 3 = dot 4
  [0,1,2,3,5,6,7,8],   // 4 = dot 5
  [1,2,4,7,8],         // 5 = dot 6
  [3,4,7],             // 6 = dot 7
  [3,4,5,6,8],         // 7 = dot 8
  [4,5,7],             // 8 = dot 9
];

function isValidStep(from, to) {
  return ADJACENCY[from].includes(to);
}

function hasInvalidStep(pat) {
  for (let i = 0; i < pat.length - 1; i++) {
    if (!isValidStep(pat[i], pat[i + 1])) return true;
  }
  return false;
}

function countValidPatterns() {
  let total = 0;
  function dfs(last, visited, len) {
    if (len >= MIN_DOTS) total++;
    if (len === 9) return;
    for (const next of ADJACENCY[last]) {
      if (!visited[next]) {
        visited[next] = true;
        dfs(next, visited, len + 1);
        visited[next] = false;
      }
    }
  }
  for (let s = 0; s < 9; s++) {
    const v = new Array(9).fill(false);
    v[s] = true;
    dfs(s, v, 1);
  }
  return total;
}

function updateCounters() {
  const rem = Math.max(0, TOTAL_VALID - history.length - discarded.length);
  statReg.textContent = history.length;
  statDis.textContent = discarded.length;
  statRem.textContent = rem.toLocaleString('es');
  bump(statReg);
  bump(statDis);
  bump(statRem);
}

function bump(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 150);
}

// ═══════════════════════════════════════════════════════════════════
// SIMILARITY ENGINE
// ═══════════════════════════════════════════════════════════════════
function dotGridPos(idx) {
  return { col: idx % 3, row: Math.floor(idx / 3) };
}

function dirKey(from, to) {
  const f = dotGridPos(from), t = dotGridPos(to);
  return `${Math.sign(t.col - f.col)},${Math.sign(t.row - f.row)}`;
}

function generateSimilar() {
  // ── Feature extraction ─────────────────────────────────────────
  const startFreq = new Array(9).fill(0);
  const dotFreq   = new Array(9).fill(0);
  const dirFreq   = {};
  let   totalLen  = 0;

  history.forEach(pat => {
    startFreq[pat[0]]++;
    totalLen += pat.length;
    pat.forEach(d => dotFreq[d]++);
    for (let i = 0; i < pat.length - 1; i++) {
      const k = dirKey(pat[i], pat[i + 1]);
      dirFreq[k] = (dirFreq[k] || 0) + 1;
    }
  });

  // ── Weighted random pick ───────────────────────────────────────
  function wPick(weights, exclude) {
    let pool = [], total = 0;
    weights.forEach((w, i) => {
      if (exclude.includes(i)) return;
      pool.push({ i, w: w + 0.5 });
      total += w + 0.5;
    });
    if (!pool.length) return -1;
    let r = Math.random() * total;
    for (const item of pool) { r -= item.w; if (r <= 0) return item.i; }
    return pool[pool.length - 1].i;
  }

  // ── Generation loop ────────────────────────────────────────────
  for (let attempt = 0; attempt < 300; attempt++) {
    // Each attempt picks a fresh random length across the full valid range
    const targetLen = MIN_DOTS + Math.floor(Math.random() * (9 - MIN_DOTS + 1));
    const pat = [];

    // Pick start
    const start = wPick(startFreq, []);
    if (start === -1) break;
    pat.push(start);

    let failed = false;
    for (let step = 1; step < targetLen; step++) {
      const last = pat[pat.length - 1];

      // Score each candidate dot (only adjacency-valid, unvisited)
      const scores = new Array(9).fill(0);
      for (let d = 0; d < 9; d++) {
        if (pat.includes(d) || !isValidStep(last, d)) { scores[d] = -1; continue; }
        const dk = dirKey(last, d);
        scores[d] = (dirFreq[dk] || 0) * 2 + (dotFreq[d] || 0);
      }

      const next = wPick(scores.map(s => Math.max(0, s)), pat);
      if (next === -1) { failed = true; break; }
      pat.push(next);
    }

    if (!failed && pat.length >= MIN_DOTS && !isDuplicate(pat) && !isDiscarded(pat)) return pat;
  }

  // Fallback: random valid pattern
  return generateRandom();
}

function generateRandom() {
  for (let a = 0; a < 300; a++) {
    const len   = MIN_DOTS + Math.floor(Math.random() * (9 - MIN_DOTS + 1));
    const start = Math.floor(Math.random() * 9);
    const pat   = [start];
    const used  = new Set([start]);
    let ok = true;
    for (let step = 1; step < len; step++) {
      const cands = ADJACENCY[pat[pat.length - 1]].filter(d => !used.has(d));
      if (!cands.length) { ok = false; break; }
      const next = cands[Math.floor(Math.random() * cands.length)];
      pat.push(next);
      used.add(next);
    }
    if (ok && pat.length >= MIN_DOTS && !isDuplicate(pat) && !isDiscarded(pat)) return pat;
  }
  return null;
}

btnGen.addEventListener('click', async function handleGen() {
  btnGen.disabled = true;

  let pat = generateSimilar();

  // Safety net: if a generated pattern somehow has an invalid step,
  // auto-discard it and retry after 2 s until one is valid.
  while (pat && hasInvalidStep(pat)) {
    if (!isDiscarded(pat)) discardPattern(pat);
    setStatus('Patrón inválido descartado, reintentando…', null);
    await new Promise(r => setTimeout(r, 2000));
    pat = generateSimilar();
  }

  btnGen.disabled = false;

  if (!pat) {
    setStatus('No se pudo generar un patrón único', null);
    return;
  }
  current = pat;
  phase   = 'gen';
  btnReg.disabled = false;
  syncButtons();
  setStatus(`Patrón generado · ${pat.length} puntos · regístralo o descártalo`, 'gen');
  render();
});
