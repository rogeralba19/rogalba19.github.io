<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cosecha | ALBA STUDIO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(0, 170, 255, 0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 18px;
            color: #00aaff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 span {
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .back-btn, .action-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover, .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .action-btn.primary {
            background: linear-gradient(90deg, #00aaff, #00ffaa);
            border: none;
            color: #000;
            font-weight: bold;
        }

        .action-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 170, 255, 0.4);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-card.highlight {
            border-color: rgba(0, 255, 136, 0.3);
            background: rgba(0, 255, 136, 0.05);
        }

        .stat-card.pending {
            border-color: rgba(255, 170, 0, 0.3);
            background: rgba(255, 170, 0, 0.05);
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
        }

        .stat-card.pending .stat-value {
            color: #ffaa00;
        }

        .stat-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        .tab {
            padding: 12px 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #00aaff;
            border-bottom-color: #00aaff;
        }

        /* Section */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Trabajos (Jobs) List */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .job-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .job-card:hover {
            border-color: rgba(0, 170, 255, 0.5);
            transform: translateY(-2px);
        }

        .job-card.active {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .job-title {
            font-size: 16px;
            font-weight: 600;
        }

        .job-status {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 10px;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .job-status.inactive {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
        }

        .job-details {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .job-details span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .job-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .job-stat {
            text-align: center;
        }

        .job-stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #00aaff;
        }

        .job-stat-label {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        /* Calendar */
        .calendar-container {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .calendar-nav button {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .calendar-nav button:hover {
            background: rgba(0, 170, 255, 0.3);
        }

        .calendar-month {
            font-size: 18px;
            font-weight: 600;
            min-width: 180px;
            text-align: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day-header {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            padding: 8px 5px;
            text-transform: uppercase;
        }

        .calendar-day {
            aspect-ratio: 1;
            min-height: 55px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 5px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .calendar-day:hover {
            background: rgba(0, 170, 255, 0.1);
            border-color: rgba(0, 170, 255, 0.3);
        }

        .calendar-day.other-month {
            opacity: 0.3;
        }

        .calendar-day.today {
            border-color: #00aaff;
            background: rgba(0, 170, 255, 0.1);
        }

        .calendar-day.has-entries {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .calendar-day.has-pending {
            background: rgba(255, 170, 0, 0.1);
            border-color: rgba(255, 170, 0, 0.3);
        }

        .day-number {
            font-size: 14px;
            font-weight: 600;
        }

        .day-amount {
            font-size: 10px;
            color: #00ff88;
            margin-top: auto;
        }

        /* Entries List */
        .entries-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .entry-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            transition: all 0.3s;
        }

        .entry-card:hover {
            border-color: rgba(0, 170, 255, 0.3);
        }

        .entry-info {
            flex: 1;
            min-width: 200px;
        }

        .entry-date {
            font-size: 14px;
            font-weight: 600;
            color: #00aaff;
            margin-bottom: 4px;
        }

        .entry-details {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .entry-amount {
            text-align: right;
        }

        .entry-total {
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
        }

        .entry-status {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 4px;
        }

        .entry-status.paid {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .entry-status.pending {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
        }

        .entry-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .icon-btn:hover {
            background: rgba(0, 170, 255, 0.3);
        }

        .icon-btn.delete:hover {
            background: rgba(255, 68, 102, 0.3);
            color: #ff4466;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 100%);
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 100%);
            z-index: 1;
        }

        .modal-header h2 {
            font-size: 18px;
            color: #00aaff;
        }

        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ff4466;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00aaff;
        }

        .form-group select option {
            background: #1a1a2e;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .work-type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .work-type-option {
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .work-type-option:hover {
            border-color: rgba(0, 170, 255, 0.3);
        }

        .work-type-option.selected {
            border-color: #00aaff;
            background: rgba(0, 170, 255, 0.1);
        }

        .work-type-option .icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .work-type-option .label {
            font-size: 13px;
            font-weight: 600;
        }

        .conditional-fields {
            display: none;
            margin-top: 15px;
        }

        .conditional-fields.visible {
            display: block;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .toggle-switch {
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: rgba(0, 255, 136, 0.3);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle-switch.active::after {
            left: 26px;
            background: #00ff88;
        }

        .calculated-total {
            font-size: 32px;
            font-weight: bold;
            color: #00ff88;
            text-align: center;
            padding: 20px;
            background: rgba(0, 255, 136, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00aaff, #00ffaa);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 170, 255, 0.4);
        }

        .btn-danger {
            background: rgba(255, 68, 102, 0.2);
            color: #ff4466;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
        }

        /* Quick add from job */
        .quick-add-bar {
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .quick-add-bar.visible {
            display: block;
        }

        .quick-add-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .quick-add-title {
            font-size: 14px;
            font-weight: 600;
        }

        .quick-add-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 18px;
        }

        .quick-add-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .quick-add-form .form-group {
            margin: 0;
            flex: 1;
            min-width: 120px;
        }

        .quick-add-form .form-group label {
            font-size: 10px;
        }

        .quick-add-form input {
            padding: 10px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background: rgba(0, 255, 136, 0.9);
            color: #000;
            border-radius: 8px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
        }

        .toast.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: rgba(255, 68, 102, 0.9);
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 12px 15px;
            }

            .header h1 {
                font-size: 14px;
            }

            .container {
                padding: 15px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .calendar-day {
                min-height: 45px;
            }

            .day-number {
                font-size: 12px;
            }

            .day-amount {
                font-size: 9px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-footer {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

            .entry-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .entry-amount {
                text-align: left;
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .calendar-grid {
                gap: 3px;
            }

            .calendar-day {
                min-height: 38px;
                border-radius: 4px;
                padding: 3px;
            }

            .calendar-day-header {
                font-size: 9px;
                padding: 5px 2px;
            }

            .jobs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1><span>🍎</span> Registro de Cosecha</h1>
        <div class="header-actions">
            <a href="index.html" class="back-btn">← Volver</a>
            <button class="action-btn" onclick="openJobModal()">+ Trabajo</button>
            <button class="action-btn primary" onclick="openEntryModal()">+ Registro</button>
        </div>
    </header>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card highlight">
                <div class="stat-value" id="totalEarnings">$0</div>
                <div class="stat-label">Total Mes</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-value" id="pendingAmount">$0</div>
                <div class="stat-label">Pendiente</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalDays">0</div>
                <div class="stat-label">Dias</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalUnits">0</div>
                <div class="stat-label">Unidades</div>
            </div>
        </div>

        <!-- Quick Add Bar (when job is selected) -->
        <div class="quick-add-bar" id="quickAddBar">
            <div class="quick-add-header">
                <span class="quick-add-title" id="quickAddTitle">Agregar a: Trabajo X</span>
                <button class="quick-add-close" onclick="closeQuickAdd()">&times;</button>
            </div>
            <div class="quick-add-form">
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="quickDate">
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" id="quickQuantity" placeholder="0" step="0.5">
                </div>
                <button class="btn btn-primary" onclick="quickAddEntry()">Agregar</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('trabajos')">Trabajos</button>
            <button class="tab" onclick="switchTab('calendario')">Calendario</button>
            <button class="tab" onclick="switchTab('registros')">Registros</button>
        </div>

        <!-- Trabajos Section -->
        <div class="section active" id="trabajosSection">
            <div class="jobs-grid" id="jobsGrid">
                <!-- Jobs will be rendered here -->
            </div>
        </div>

        <!-- Calendario Section -->
        <div class="section" id="calendarioSection">
            <div class="calendar-container">
                <div class="calendar-header">
                    <div class="calendar-nav">
                        <button onclick="changeMonth(-1)">‹</button>
                        <span class="calendar-month" id="currentMonth">Enero 2024</span>
                        <button onclick="changeMonth(1)">›</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </div>

        <!-- Registros Section -->
        <div class="section" id="registrosSection">
            <div class="entries-list" id="entriesList"></div>
        </div>
    </div>

    <!-- Job Modal -->
    <div class="modal-overlay" id="jobModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="jobModalTitle">Nuevo Trabajo</h2>
                <button class="modal-close" onclick="closeJobModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="jobId">

                <div class="form-group">
                    <label>Nombre del Trabajo</label>
                    <input type="text" id="jobName" placeholder="Ej: Cosecha Manzanas Finca X">
                </div>

                <div class="form-group">
                    <label>Producto</label>
                    <select id="jobProduct">
                        <option value="">Seleccionar fruta</option>
                        <option value="Fresa">Fresa</option>
                        <option value="Frambuesa">Frambuesa</option>
                        <option value="Arandano">Arandano</option>
                        <option value="Mora">Mora</option>
                        <option value="Cereza">Cereza</option>
                        <option value="Ciruela">Ciruela</option>
                        <option value="Manzana">Manzana</option>
                        <option value="Pera">Pera</option>
                        <option value="Uva">Uva</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tipo de Trabajo</label>
                    <div class="work-type-selector">
                        <div class="work-type-option selected" onclick="selectJobType('trato')" id="jobTypeTrato">
                            <div class="icon">📦</div>
                            <div class="label">Al Trato</div>
                        </div>
                        <div class="work-type-option" onclick="selectJobType('dia')" id="jobTypeDia">
                            <div class="icon">📅</div>
                            <div class="label">Al Dia</div>
                        </div>
                    </div>
                </div>

                <div class="conditional-fields visible" id="jobTratoFields">
                    <div class="form-group">
                        <label>Recipiente / Unidad</label>
                        <select id="jobUnit">
                            <option value="totens">Totens</option>
                            <option value="capacho_grande">Capacho Grande</option>
                            <option value="capacho_pequeno">Capacho Pequeño</option>
                            <option value="kilo">Kilo</option>
                            <option value="bandeja">Bandeja</option>
                            <option value="bins">Bins (grupo)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Precio por Unidad ($)</label>
                        <input type="number" id="jobPrice" placeholder="0.00" step="0.01">
                    </div>
                </div>

                <div class="conditional-fields" id="jobDiaFields">
                    <div class="form-group">
                        <label>Pago por Dia ($)</label>
                        <input type="number" id="jobDailyRate" placeholder="0.00" step="0.01">
                    </div>
                </div>

                <div class="form-group">
                    <label>Empleador / Finca</label>
                    <input type="text" id="jobEmployer" placeholder="Nombre del empleador o finca">
                </div>

                <div class="form-group">
                    <div class="toggle-row">
                        <span>Trabajo Activo</span>
                        <div class="toggle-switch active" id="jobActiveToggle" onclick="toggleJobActive()"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="deleteJobBtn" style="display: none;" onclick="deleteJob()">Eliminar</button>
                <button class="btn btn-secondary" onclick="closeJobModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveJob()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Entry Modal -->
    <div class="modal-overlay" id="entryModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="entryModalTitle">Nuevo Registro</h2>
                <button class="modal-close" onclick="closeEntryModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="entryId">

                <div class="form-group">
                    <label>Trabajo</label>
                    <select id="entryJob" onchange="onJobSelect()">
                        <option value="">Seleccionar trabajo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="entryDate">
                </div>

                <div id="entryTratoFields" class="conditional-fields visible">
                    <div class="form-group">
                        <label>Cantidad <span id="entryUnitLabel">(unidades)</span></label>
                        <input type="number" id="entryQuantity" placeholder="0" step="0.5" oninput="calculateEntryTotal()">
                    </div>
                </div>

                <div id="entryDiaFields" class="conditional-fields">
                    <div class="form-group">
                        <label>Horas trabajadas (opcional)</label>
                        <input type="number" id="entryHours" placeholder="8" step="0.5">
                    </div>
                </div>

                <div class="form-group">
                    <label>Total</label>
                    <div class="calculated-total" id="entryTotal">$0.00</div>
                </div>

                <div class="form-group">
                    <div class="toggle-row">
                        <span id="entryPaidLabel">Pendiente de pago</span>
                        <div class="toggle-switch" id="entryPaidToggle" onclick="toggleEntryPaid()"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Notas (opcional)</label>
                    <textarea id="entryNotes" rows="2" placeholder="Observaciones..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="deleteEntryBtn" style="display: none;" onclick="deleteEntry()">Eliminar</button>
                <button class="btn btn-secondary" onclick="closeEntryModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveEntry()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Day Modal -->
    <div class="modal-overlay" id="dayModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="dayModalTitle">Registros del dia</h2>
                <button class="modal-close" onclick="closeDayModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="dayEntriesList"></div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 15px;" onclick="addEntryForDay()">
                    + Agregar registro
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBvju4gyCpz6E6R3TsvO1uR1KZB7ZbW9VU",
            authDomain: "albastudio-e0d5b.firebaseapp.com",
            databaseURL: "https://albastudio-e0d5b-default-rtdb.firebaseio.com",
            projectId: "albastudio-e0d5b",
            storageBucket: "albastudio-e0d5b.firebasestorage.app",
            messagingSenderId: "519359936167",
            appId: "1:519359936167:web:8c2680ed1e4583def28d82"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.database();

        // State
        let currentUser = null;
        let jobs = [];
        let entries = [];
        let currentDate = new Date();
        let selectedJob = null;
        let selectedDayDate = null;

        // Job modal state
        let jobType = 'trato';
        let jobActive = true;

        // Entry modal state
        let entryPaid = false;

        // Auth
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadData();
            } else {
                window.location.href = 'index.html';
            }
        });

        // Load data
        function loadData() {
            if (!currentUser) return;

            // Load jobs
            db.ref(`jobs/${currentUser.uid}`).on('value', (snapshot) => {
                jobs = [];
                snapshot.forEach((child) => {
                    jobs.push({ id: child.key, ...child.val() });
                });
                renderJobs();
                updateJobSelect();
            });

            // Load entries
            db.ref(`harvest/${currentUser.uid}`).on('value', (snapshot) => {
                entries = [];
                snapshot.forEach((child) => {
                    entries.push({ id: child.key, ...child.val() });
                });
                entries.sort((a, b) => new Date(b.date) - new Date(a.date));
                updateStats();
                renderCalendar();
                renderEntries();
            });
        }

        // Stats
        function updateStats() {
            const now = new Date();
            const month = now.getMonth();
            const year = now.getFullYear();

            const monthEntries = entries.filter(e => {
                const d = new Date(e.date);
                return d.getMonth() === month && d.getFullYear() === year;
            });

            const total = monthEntries.reduce((sum, e) => sum + (e.total || 0), 0);
            const pending = monthEntries.filter(e => !e.paid).reduce((sum, e) => sum + (e.total || 0), 0);
            const days = new Set(monthEntries.map(e => e.date)).size;
            const units = monthEntries.reduce((sum, e) => sum + (e.quantity || 0), 0);

            document.getElementById('totalEarnings').textContent = '$' + total.toFixed(2);
            document.getElementById('pendingAmount').textContent = '$' + pending.toFixed(2);
            document.getElementById('totalDays').textContent = days;
            document.getElementById('totalUnits').textContent = Math.round(units);
        }

        // Tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(tab + 'Section').classList.add('active');
        }

        // Jobs
        function renderJobs() {
            const grid = document.getElementById('jobsGrid');

            if (jobs.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="icon">💼</div>
                        <h3>No hay trabajos</h3>
                        <p>Crea un trabajo para empezar a registrar tu cosecha</p>
                    </div>
                `;
                return;
            }

            const unitNames = {
                'totens': 'Totens',
                'capacho_grande': 'Capacho Grande',
                'capacho_pequeno': 'Capacho Pequeño',
                'kilo': 'Kilos',
                'bandeja': 'Bandejas',
                'bins': 'Bins'
            };

            grid.innerHTML = jobs.map(job => {
                const jobEntries = entries.filter(e => e.jobId === job.id);
                const totalEarned = jobEntries.reduce((sum, e) => sum + (e.total || 0), 0);
                const totalUnits = jobEntries.reduce((sum, e) => sum + (e.quantity || 0), 0);
                const daysWorked = new Set(jobEntries.map(e => e.date)).size;

                return `
                    <div class="job-card ${job.active !== false ? 'active' : ''}" onclick="selectJobForQuickAdd('${job.id}')">
                        <div class="job-header">
                            <span class="job-title">${job.name || job.product}</span>
                            <span class="job-status ${job.active === false ? 'inactive' : ''}">${job.active === false ? 'Inactivo' : 'Activo'}</span>
                        </div>
                        <div class="job-details">
                            <span>🍎 ${job.product}</span>
                            <span>📍 ${job.employer || 'Sin especificar'}</span>
                            <span>${job.type === 'dia' ? '📅 Al Dia - $' + job.dailyRate : '📦 ' + (unitNames[job.unit] || job.unit) + ' - $' + job.price}</span>
                        </div>
                        <div class="job-stats">
                            <div class="job-stat">
                                <div class="job-stat-value">${daysWorked}</div>
                                <div class="job-stat-label">Dias</div>
                            </div>
                            <div class="job-stat">
                                <div class="job-stat-value">${Math.round(totalUnits)}</div>
                                <div class="job-stat-label">Unidades</div>
                            </div>
                            <div class="job-stat">
                                <div class="job-stat-value" style="color: #00ff88;">$${totalEarned.toFixed(0)}</div>
                                <div class="job-stat-label">Total</div>
                            </div>
                        </div>
                        <button class="icon-btn" style="position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; font-size: 12px;" onclick="event.stopPropagation(); editJob('${job.id}')">✏️</button>
                    </div>
                `;
            }).join('');
        }

        function selectJobForQuickAdd(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (!job || job.type === 'dia') {
                openEntryModal(null, jobId);
                return;
            }

            selectedJob = job;
            document.getElementById('quickAddTitle').textContent = `Agregar a: ${job.name || job.product}`;
            document.getElementById('quickDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('quickQuantity').value = '';
            document.getElementById('quickAddBar').classList.add('visible');
        }

        function closeQuickAdd() {
            selectedJob = null;
            document.getElementById('quickAddBar').classList.remove('visible');
        }

        async function quickAddEntry() {
            if (!selectedJob || !currentUser) return;

            const date = document.getElementById('quickDate').value;
            const quantity = parseFloat(document.getElementById('quickQuantity').value) || 0;

            if (!date || quantity <= 0) {
                showToast('Completa fecha y cantidad', 'error');
                return;
            }

            const total = quantity * (selectedJob.price || 0);

            try {
                await db.ref(`harvest/${currentUser.uid}`).push({
                    jobId: selectedJob.id,
                    date,
                    quantity,
                    total,
                    paid: false,
                    createdAt: Date.now()
                });
                showToast('Registro agregado');
                document.getElementById('quickQuantity').value = '';
            } catch (error) {
                showToast('Error al guardar', 'error');
            }
        }

        // Job Modal
        function openJobModal(jobId = null) {
            document.getElementById('jobId').value = '';
            document.getElementById('jobName').value = '';
            document.getElementById('jobProduct').value = '';
            document.getElementById('jobUnit').value = 'totens';
            document.getElementById('jobPrice').value = '';
            document.getElementById('jobDailyRate').value = '';
            document.getElementById('jobEmployer').value = '';
            jobType = 'trato';
            jobActive = true;
            updateJobTypeUI();
            updateJobActiveUI();
            document.getElementById('deleteJobBtn').style.display = 'none';
            document.getElementById('jobModalTitle').textContent = 'Nuevo Trabajo';

            if (jobId) {
                const job = jobs.find(j => j.id === jobId);
                if (job) {
                    document.getElementById('jobId').value = job.id;
                    document.getElementById('jobName').value = job.name || '';
                    document.getElementById('jobProduct').value = job.product || '';
                    document.getElementById('jobUnit').value = job.unit || 'totens';
                    document.getElementById('jobPrice').value = job.price || '';
                    document.getElementById('jobDailyRate').value = job.dailyRate || '';
                    document.getElementById('jobEmployer').value = job.employer || '';
                    jobType = job.type || 'trato';
                    jobActive = job.active !== false;
                    updateJobTypeUI();
                    updateJobActiveUI();
                    document.getElementById('deleteJobBtn').style.display = 'block';
                    document.getElementById('jobModalTitle').textContent = 'Editar Trabajo';
                }
            }

            document.getElementById('jobModal').classList.add('visible');
        }

        function editJob(jobId) {
            openJobModal(jobId);
        }

        function closeJobModal() {
            document.getElementById('jobModal').classList.remove('visible');
        }

        function selectJobType(type) {
            jobType = type;
            updateJobTypeUI();
        }

        function updateJobTypeUI() {
            document.getElementById('jobTypeTrato').classList.toggle('selected', jobType === 'trato');
            document.getElementById('jobTypeDia').classList.toggle('selected', jobType === 'dia');
            document.getElementById('jobTratoFields').classList.toggle('visible', jobType === 'trato');
            document.getElementById('jobDiaFields').classList.toggle('visible', jobType === 'dia');
        }

        function toggleJobActive() {
            jobActive = !jobActive;
            updateJobActiveUI();
        }

        function updateJobActiveUI() {
            document.getElementById('jobActiveToggle').classList.toggle('active', jobActive);
        }

        async function saveJob() {
            if (!currentUser) return;

            const id = document.getElementById('jobId').value;
            const data = {
                name: document.getElementById('jobName').value,
                product: document.getElementById('jobProduct').value,
                type: jobType,
                employer: document.getElementById('jobEmployer').value,
                active: jobActive,
                updatedAt: Date.now()
            };

            if (jobType === 'trato') {
                data.unit = document.getElementById('jobUnit').value;
                data.price = parseFloat(document.getElementById('jobPrice').value) || 0;
            } else {
                data.dailyRate = parseFloat(document.getElementById('jobDailyRate').value) || 0;
            }

            if (!data.product) {
                showToast('Selecciona un producto', 'error');
                return;
            }

            try {
                if (id) {
                    await db.ref(`jobs/${currentUser.uid}/${id}`).update(data);
                } else {
                    data.createdAt = Date.now();
                    await db.ref(`jobs/${currentUser.uid}`).push(data);
                }
                showToast('Trabajo guardado');
                closeJobModal();
            } catch (error) {
                showToast('Error al guardar', 'error');
            }
        }

        async function deleteJob() {
            const id = document.getElementById('jobId').value;
            if (!id || !currentUser) return;

            if (confirm('¿Eliminar este trabajo? Los registros asociados no se eliminaran.')) {
                try {
                    await db.ref(`jobs/${currentUser.uid}/${id}`).remove();
                    showToast('Trabajo eliminado');
                    closeJobModal();
                } catch (error) {
                    showToast('Error al eliminar', 'error');
                }
            }
        }

        // Entry Modal
        function openEntryModal(entryId = null, preselectedJobId = null) {
            document.getElementById('entryId').value = '';
            document.getElementById('entryJob').value = preselectedJobId || '';
            document.getElementById('entryDate').value = selectedDayDate || new Date().toISOString().split('T')[0];
            document.getElementById('entryQuantity').value = '';
            document.getElementById('entryHours').value = '';
            document.getElementById('entryNotes').value = '';
            entryPaid = false;
            updateEntryPaidUI();
            document.getElementById('deleteEntryBtn').style.display = 'none';
            document.getElementById('entryModalTitle').textContent = 'Nuevo Registro';
            onJobSelect();

            if (entryId) {
                const entry = entries.find(e => e.id === entryId);
                if (entry) {
                    document.getElementById('entryId').value = entry.id;
                    document.getElementById('entryJob').value = entry.jobId || '';
                    document.getElementById('entryDate').value = entry.date;
                    document.getElementById('entryQuantity').value = entry.quantity || '';
                    document.getElementById('entryHours').value = entry.hours || '';
                    document.getElementById('entryNotes').value = entry.notes || '';
                    entryPaid = entry.paid || false;
                    updateEntryPaidUI();
                    document.getElementById('deleteEntryBtn').style.display = 'block';
                    document.getElementById('entryModalTitle').textContent = 'Editar Registro';
                    onJobSelect();
                }
            }

            document.getElementById('entryModal').classList.add('visible');
        }

        function closeEntryModal() {
            document.getElementById('entryModal').classList.remove('visible');
            selectedDayDate = null;
        }

        function updateJobSelect() {
            const select = document.getElementById('entryJob');
            const currentVal = select.value;
            select.innerHTML = '<option value="">Seleccionar trabajo</option>' +
                jobs.filter(j => j.active !== false).map(j =>
                    `<option value="${j.id}">${j.name || j.product} - ${j.employer || ''}</option>`
                ).join('');
            select.value = currentVal;
        }

        function onJobSelect() {
            const jobId = document.getElementById('entryJob').value;
            const job = jobs.find(j => j.id === jobId);

            if (job) {
                const unitNames = {
                    'totens': 'totens',
                    'capacho_grande': 'capachos grandes',
                    'capacho_pequeno': 'capachos pequeños',
                    'kilo': 'kilos',
                    'bandeja': 'bandejas',
                    'bins': 'bins'
                };

                if (job.type === 'dia') {
                    document.getElementById('entryTratoFields').classList.remove('visible');
                    document.getElementById('entryDiaFields').classList.add('visible');
                    document.getElementById('entryTotal').textContent = '$' + (job.dailyRate || 0).toFixed(2);
                } else {
                    document.getElementById('entryTratoFields').classList.add('visible');
                    document.getElementById('entryDiaFields').classList.remove('visible');
                    document.getElementById('entryUnitLabel').textContent = `(${unitNames[job.unit] || 'unidades'})`;
                    calculateEntryTotal();
                }
            }
        }

        function calculateEntryTotal() {
            const jobId = document.getElementById('entryJob').value;
            const job = jobs.find(j => j.id === jobId);
            const quantity = parseFloat(document.getElementById('entryQuantity').value) || 0;

            let total = 0;
            if (job) {
                if (job.type === 'dia') {
                    total = job.dailyRate || 0;
                } else {
                    total = quantity * (job.price || 0);
                }
            }
            document.getElementById('entryTotal').textContent = '$' + total.toFixed(2);
            return total;
        }

        function toggleEntryPaid() {
            entryPaid = !entryPaid;
            updateEntryPaidUI();
        }

        function updateEntryPaidUI() {
            document.getElementById('entryPaidToggle').classList.toggle('active', entryPaid);
            document.getElementById('entryPaidLabel').textContent = entryPaid ? 'Pagado' : 'Pendiente de pago';
        }

        async function saveEntry() {
            if (!currentUser) return;

            const id = document.getElementById('entryId').value;
            const jobId = document.getElementById('entryJob').value;
            const job = jobs.find(j => j.id === jobId);
            const date = document.getElementById('entryDate').value;

            if (!jobId || !date) {
                showToast('Selecciona trabajo y fecha', 'error');
                return;
            }

            const data = {
                jobId,
                date,
                paid: entryPaid,
                notes: document.getElementById('entryNotes').value,
                updatedAt: Date.now()
            };

            if (job.type === 'dia') {
                data.total = job.dailyRate || 0;
                data.hours = parseFloat(document.getElementById('entryHours').value) || null;
            } else {
                data.quantity = parseFloat(document.getElementById('entryQuantity').value) || 0;
                data.total = data.quantity * (job.price || 0);
            }

            try {
                if (id) {
                    await db.ref(`harvest/${currentUser.uid}/${id}`).update(data);
                } else {
                    data.createdAt = Date.now();
                    await db.ref(`harvest/${currentUser.uid}`).push(data);
                }
                showToast('Registro guardado');
                closeEntryModal();
            } catch (error) {
                showToast('Error al guardar', 'error');
            }
        }

        async function deleteEntry() {
            const id = document.getElementById('entryId').value;
            if (!id || !currentUser) return;

            if (confirm('¿Eliminar este registro?')) {
                try {
                    await db.ref(`harvest/${currentUser.uid}/${id}`).remove();
                    showToast('Registro eliminado');
                    closeEntryModal();
                } catch (error) {
                    showToast('Error al eliminar', 'error');
                }
            }
        }

        // Calendar
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                              'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const daysInMonth = lastDay.getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const dayNames = ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'];
            dayNames.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.textContent = day;
                grid.appendChild(header);
            });

            const prevMonth = new Date(year, month, 0);
            for (let i = startDay - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.innerHTML = `<span class="day-number">${prevMonth.getDate() - i}</span>`;
                grid.appendChild(day);
            }

            const today = new Date();
            for (let i = 1; i <= daysInMonth; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day';

                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayEntries = entries.filter(e => e.date === dateStr);
                const dayTotal = dayEntries.reduce((sum, e) => sum + (e.total || 0), 0);
                const hasPending = dayEntries.some(e => !e.paid);

                if (today.getDate() === i && today.getMonth() === month && today.getFullYear() === year) {
                    day.classList.add('today');
                }
                if (dayEntries.length > 0) {
                    day.classList.add(hasPending ? 'has-pending' : 'has-entries');
                }

                day.innerHTML = `
                    <span class="day-number">${i}</span>
                    ${dayTotal > 0 ? `<span class="day-amount">$${dayTotal.toFixed(0)}</span>` : ''}
                `;

                day.onclick = () => openDayModal(dateStr, dayEntries);
                grid.appendChild(day);
            }

            const remainingDays = 42 - (startDay + daysInMonth);
            for (let i = 1; i <= remainingDays; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.innerHTML = `<span class="day-number">${i}</span>`;
                grid.appendChild(day);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        // Day Modal
        function openDayModal(dateStr, dayEntries) {
            selectedDayDate = dateStr;
            const date = new Date(dateStr + 'T12:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dayModalTitle').textContent = date.toLocaleDateString('es-ES', options);

            const list = document.getElementById('dayEntriesList');
            if (dayEntries.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.5); padding: 20px;">No hay registros para este dia</p>';
            } else {
                list.innerHTML = dayEntries.map(e => {
                    const job = jobs.find(j => j.id === e.jobId);
                    return `
                        <div class="entry-card" onclick="closeDayModal(); openEntryModal('${e.id}')">
                            <div class="entry-info">
                                <div class="entry-date">${job ? (job.name || job.product) : 'Trabajo eliminado'}</div>
                                <div class="entry-details">${e.quantity ? e.quantity + ' unidades' : 'Jornada'} ${e.paid ? '• Pagado' : '• Pendiente'}</div>
                            </div>
                            <div class="entry-total">$${(e.total || 0).toFixed(2)}</div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('dayModal').classList.add('visible');
        }

        function closeDayModal() {
            document.getElementById('dayModal').classList.remove('visible');
        }

        function addEntryForDay() {
            closeDayModal();
            openEntryModal();
        }

        // Entries List
        function renderEntries() {
            const list = document.getElementById('entriesList');

            if (entries.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <h3>No hay registros</h3>
                        <p>Agrega tu primer registro de cosecha</p>
                    </div>
                `;
                return;
            }

            const monthNames = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

            list.innerHTML = entries.slice(0, 50).map(e => {
                const job = jobs.find(j => j.id === e.jobId);
                const date = new Date(e.date + 'T12:00:00');
                return `
                    <div class="entry-card" onclick="openEntryModal('${e.id}')">
                        <div class="entry-info">
                            <div class="entry-date">${date.getDate()} ${monthNames[date.getMonth()]} - ${job ? (job.name || job.product) : 'Trabajo eliminado'}</div>
                            <div class="entry-details">${e.quantity ? e.quantity + ' unidades' : 'Jornada'} ${job?.employer ? '• ' + job.employer : ''}</div>
                        </div>
                        <div class="entry-amount">
                            <div class="entry-total">$${(e.total || 0).toFixed(2)}</div>
                            <span class="entry-status ${e.paid ? 'paid' : 'pending'}">${e.paid ? 'Pagado' : 'Pendiente'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast visible' + (type === 'error' ? ' error' : '');
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
        });
    </script>
</body>
</html>
