<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosecha | Nuevo registro</title>
  <style>
    :root {
      --bg: #020617;
      --card: #0b1220;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #2f7d32;
      --primary-soft: #163124;
      --border: #233248;
      --sat: #1b2537;
      --sun: #243348;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 65%);
      color: var(--text);
      padding: 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 380px) minmax(420px, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
    }

    h1, h2 { margin: 0 0 14px; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; }

    .muted { color: var(--muted); font-size: .9rem; }

    .field { margin-bottom: 12px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: .86rem;
      font-weight: 600;
    }

    select, input, textarea, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }

    select {
      background: #0f172a;
      cursor: pointer;
      color: var(--text);
    }

    select:focus, input:focus, textarea:focus {
      outline: 2px solid #cde8cf;
      border-color: #84c287;
    }

    button {
      background: linear-gradient(90deg, #2f7d32, #3f9c43);
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, box-shadow .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(47, 125, 50, .25);
    }

    .job-list {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .job-list li {
      background: var(--primary-soft);
      color: #a7f3b8;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: .82rem;
      font-weight: 600;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(56px, 1fr));
      gap: 8px;
    }

    .day-name, .day-cell {
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      padding: 10px 6px;
    }

    .day-name {
      background: #0f172a;
      color: #93c5fd;
      font-size: .8rem;
      font-weight: 700;
    }

    .day-cell {
      min-height: 74px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-weight: 600;
      background: #111c2f;
      color: #cbd5e1;
      box-shadow: 0 2px 0 rgba(2, 6, 23, .5);
    }

    .day-cell.empty { opacity: 0; pointer-events: none; }

    .day-cell.saturday {
      background: var(--sat);
      border-color: #33445f;
    }

    .day-cell.sunday {
      background: var(--sun);
      border-color: #415879;
      color: #dbeafe;
    }

    .badge {
      align-self: center;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: .7rem;
      background: #ecfdf3;
      color: #15803d;
      border: 1px solid #c6f6d5;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="card">
      <h1>Cosecha · Nuevo registro</h1>
      <p class="muted">Ahora el selector de trabajos se llena correctamente con la lista disponible.</p>

      <form id="registro-form">
        <div class="field">
          <label for="trabajo">Trabajo</label>
          <select id="trabajo" name="trabajo" required></select>
        </div>

        <div class="field">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date" required />
        </div>

        <div class="field">
          <label for="kilos">Kilos</label>
          <input id="kilos" name="kilos" type="number" min="1" placeholder="Ej: 230" required />
        </div>

        <div class="field">
          <label for="nota">Nota</label>
          <textarea id="nota" name="nota" rows="3" placeholder="Detalle adicional"></textarea>
        </div>

        <button type="submit">Guardar registro</button>
      </form>

      <h2 style="margin-top:18px">Trabajos cargados</h2>
      <ul class="job-list" id="job-list"></ul>
    </section>

    <section class="card">
      <div class="calendar-header">
        <h2>Calendario de cosecha</h2>
        <span class="muted" id="month-label"></span>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>
  </main>

  <script>
    const defaultTrabajos = [
      { id: 'uva', nombre: 'Cosecha de uva' },
      { id: 'manzana', nombre: 'Recolección de manzana' },
      { id: 'pera', nombre: 'Clasificación de pera' }
    ];

    const trabajos = JSON.parse(localStorage.getItem('trabajos-disponibles') || 'null') || defaultTrabajos;

    const selectTrabajo = document.getElementById('trabajo');
    const jobList = document.getElementById('job-list');

    function renderTrabajos() {
      selectTrabajo.innerHTML = '';

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecciona un trabajo';
      placeholder.disabled = true;
      placeholder.selected = true;
      selectTrabajo.appendChild(placeholder);

      trabajos.forEach((trabajo) => {
        const option = document.createElement('option');
        option.value = trabajo.id;
        option.textContent = trabajo.nombre;
        selectTrabajo.appendChild(option);

        const li = document.createElement('li');
        li.textContent = trabajo.nombre;
        jobList.appendChild(li);
      });
    }

    function renderCalendar() {
      const calendar = document.getElementById('calendar');
      const monthLabel = document.getElementById('month-label');
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const firstDay = new Date(year, month, 1);
      const totalDays = new Date(year, month + 1, 0).getDate();
      const startWeekday = firstDay.getDay();

      monthLabel.textContent = firstDay.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });

      calendar.innerHTML = '';
      ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].forEach((d) => {
        const head = document.createElement('div');
        head.className = 'day-name';
        head.textContent = d;
        calendar.appendChild(head);
      });

      for (let i = 0; i < startWeekday; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        calendar.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day++) {
        const date = new Date(year, month, day);
        const weekday = date.getDay();
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        if (weekday === 6) cell.classList.add('saturday');
        if (weekday === 0) cell.classList.add('sunday');

        cell.innerHTML = `<span>${day}</span>${Math.random() > 0.72 ? '<span class="badge">Cosecha</span>' : ''}`;
        calendar.appendChild(cell);
      }
    }

    document.getElementById('registro-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const trabajoElegido = trabajos.find((item) => item.id === data.get('trabajo'));
      alert(`Registro guardado para: ${trabajoElegido?.nombre || 'Sin trabajo'}`);
      event.target.reset();
      selectTrabajo.selectedIndex = 0;
    });

    renderTrabajos();
    renderCalendar();
  </script>
</body>
</html>
