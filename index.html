<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALBA STUDIO | Training Creative Systems</title>
    <link rel="modulepreload" href="js/vendor/three.module.min.js">
    <link rel="modulepreload" href="js/galaxy.js">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        /* Capa preparada para una foto tenue detrás del grafo.
           Para activarla: background-image: url('...'); opacity: 0.14; */
        #photo-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-position: center;
            background-size: cover;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #overlay-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ui-layer {
            position: fixed;
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        .metrics {
            top: 20px;
            left: 20px;
        }

        .metrics p {
            margin: 4px 0;
            font-size: 10px;
        }

        .metrics .brand {
            color: rgba(255, 255, 255, 0.75);
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .metrics .value {
            color: #00ff88;
        }

        .metrics .label {
            color: rgba(255, 255, 255, 0.4);
        }

        .architecture {
            top: 20px;
            right: 20px;
            text-align: right;
        }

        .architecture p {
            margin: 3px 0;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.3);
        }

        .footer {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .footer p {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .cursor-blink {
            animation: blink 1s infinite;
        }

        /* Auth UI Styles */
        .auth-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-btn {
            padding: 8px 16px;
            background: rgba(0, 170, 255, 0.15);
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 6px;
            color: #00aaff;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-btn:hover {
            background: rgba(0, 170, 255, 0.25);
            border-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
        }

        .user-menu {
            display: none;
            align-items: center;
            gap: 12px;
        }

        .user-menu.visible {
            display: flex;
        }

        .user-email {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            font-family: 'Courier New', monospace;
        }

        .menu-links {
            display: flex;
            gap: 8px;
        }

        .menu-link {
            padding: 6px 12px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 4px;
            color: #00ff88;
            font-size: 10px;
            font-family: 'Courier New', monospace;
            text-decoration: none;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .menu-link:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        .logout-btn {
            padding: 6px 12px;
            background: rgba(255, 68, 102, 0.1);
            border: 1px solid rgba(255, 68, 102, 0.2);
            border-radius: 4px;
            color: #ff4466;
            font-size: 10px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 68, 102, 0.2);
        }

        /* Auth Modal */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .auth-modal-overlay.visible {
            display: flex;
        }

        .auth-modal {
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 100%);
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 360px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 170, 255, 0.1);
        }

        .auth-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-modal-close:hover {
            color: #ff4466;
        }

        .auth-modal h2 {
            text-align: center;
            font-size: 18px;
            color: #fff;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-modal .subtitle {
            text-align: center;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .auth-tab.active {
            color: #00aaff;
            border-bottom: 2px solid #00aaff;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .auth-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00aaff, #00ffaa);
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 170, 255, 0.4);
        }

        .auth-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .auth-error {
            background: rgba(255, 68, 102, 0.1);
            border: 1px solid rgba(255, 68, 102, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
            color: #ff4466;
            font-size: 11px;
            display: none;
        }

        .auth-error.visible {
            display: block;
        }

        .auth-success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
            color: #00ff88;
            font-size: 11px;
            display: none;
        }

        .auth-success.visible {
            display: block;
        }

        /* Google Sign-In Button */
        .google-btn {
            width: 100%;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 6px;
            color: #3c4043;
            font-size: 14px;
            font-family: 'Roboto', 'Courier New', sans-serif;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .google-btn:hover {
            background: #f8f9fa;
            border-color: #c4c4c4;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .google-btn:active {
            background: #eee;
        }

        .google-btn svg {
            flex-shrink: 0;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            gap: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-divider span {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
    // ============================================
    // FIREBASE INITIALIZATION & AUTH
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyBvju4gyCpz6E6R3TsvO1uR1KZB7ZbW9VU",
        authDomain: "albastudio-e0d5b.firebaseapp.com",
        databaseURL: "https://albastudio-e0d5b-default-rtdb.firebaseio.com",
        projectId: "albastudio-e0d5b",
        storageBucket: "albastudio-e0d5b.firebasestorage.app",
        messagingSenderId: "519359936167",
        appId: "1:519359936167:web:8c2680ed1e4583def28d82"
    };

    // Initialize Firebase once
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();

    // Auth state listener
    auth.onAuthStateChanged((user) => {
        if (user) {
            // User is signed in
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('userMenu').classList.add('visible');
            const displayText = user.displayName || user.email;
            document.getElementById('userEmail').textContent = displayText;
        } else {
            // User is signed out
            document.getElementById('loginBtn').style.display = 'block';
            document.getElementById('userMenu').classList.remove('visible');
        }
    });

    // Auth Modal Functions
    function openAuthModal() {
        document.getElementById('authModalOverlay').classList.add('visible');
        document.getElementById('authError').classList.remove('visible');
        document.getElementById('authSuccess').classList.remove('visible');
    }

    function closeAuthModal(event) {
        if (!event || event.target === document.getElementById('authModalOverlay')) {
            document.getElementById('authModalOverlay').classList.remove('visible');
            // Reset forms
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
        }
    }

    function switchAuthTab(tab) {
        const tabs = document.querySelectorAll('.auth-tab');
        const forms = document.querySelectorAll('.auth-form');

        tabs.forEach(t => t.classList.remove('active'));
        forms.forEach(f => f.classList.remove('active'));

        if (tab === 'login') {
            tabs[0].classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            tabs[1].classList.add('active');
            document.getElementById('registerForm').classList.add('active');
        }

        document.getElementById('authError').classList.remove('visible');
        document.getElementById('authSuccess').classList.remove('visible');
    }

    function showAuthError(message) {
        const errorEl = document.getElementById('authError');
        errorEl.textContent = message;
        errorEl.classList.add('visible');
        document.getElementById('authSuccess').classList.remove('visible');
    }

    function showAuthSuccess(message) {
        const successEl = document.getElementById('authSuccess');
        successEl.textContent = message;
        successEl.classList.add('visible');
        document.getElementById('authError').classList.remove('visible');
    }

    // Login Handler
    async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const submitBtn = document.getElementById('loginSubmit');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';

        try {
            await auth.signInWithEmailAndPassword(email, password);
            showAuthSuccess('Sesion iniciada correctamente');
            setTimeout(() => closeAuthModal(), 1000);
        } catch (error) {
            let message = 'Error al iniciar sesion';
            if (error.code === 'auth/user-not-found') message = 'Usuario no encontrado';
            else if (error.code === 'auth/wrong-password') message = 'Contrasena incorrecta';
            else if (error.code === 'auth/invalid-email') message = 'Correo invalido';
            else if (error.code === 'auth/too-many-requests') message = 'Demasiados intentos. Intenta mas tarde';
            showAuthError(message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Entrar';
        }
    }

    // Register Handler
    async function handleRegister(event) {
        event.preventDefault();
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;
        const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
        const submitBtn = document.getElementById('registerSubmit');

        if (password !== passwordConfirm) {
            showAuthError('Las contrasenas no coinciden');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creando cuenta...';

        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            // Save user to database
            await db.ref('users/' + userCredential.user.uid).set({
                email: email,
                createdAt: Date.now(),
                role: 'user'
            });
            showAuthSuccess('Cuenta creada exitosamente');
            setTimeout(() => closeAuthModal(), 1000);
        } catch (error) {
            let message = 'Error al crear cuenta';
            if (error.code === 'auth/email-already-in-use') message = 'Este correo ya esta registrado';
            else if (error.code === 'auth/invalid-email') message = 'Correo invalido';
            else if (error.code === 'auth/weak-password') message = 'La contrasena es muy debil';
            showAuthError(message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Crear Cuenta';
        }
    }

    // Logout Handler
    function logoutUser() {
        auth.signOut();
    }

    // Google Sign-In Handler
    async function loginWithGoogle() {
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({
                prompt: 'select_account'
            });

            const result = await auth.signInWithPopup(provider);
            const user = result.user;

            const userRef = db.ref('users/' + user.uid);
            const snapshot = await userRef.once('value');

            if (!snapshot.exists()) {
                await userRef.set({
                    email: user.email,
                    displayName: user.displayName || '',
                    photoURL: user.photoURL || '',
                    createdAt: Date.now(),
                    role: 'user',
                    provider: 'google'
                });
            } else {
                await userRef.update({
                    lastLogin: Date.now(),
                    displayName: user.displayName || '',
                    photoURL: user.photoURL || ''
                });
            }

            showAuthSuccess('Sesion iniciada con Google');
            setTimeout(() => closeAuthModal(), 1000);
        } catch (error) {
            if (error.code === 'auth/cancelled-popup-request') return;
            let message = 'Error al iniciar sesion con Google';
            if (error.code === 'auth/popup-closed-by-user') {
                message = 'Inicio de sesion cancelado';
            } else if (error.code === 'auth/popup-blocked') {
                message = 'Popup bloqueado. Permite popups para este sitio';
            }
            showAuthError(message);
        }
    }
    </script>

    <script>
    // ============================================
    // VISITOR TRACKING
    // ============================================
    (function() {
        try {
            // Use already initialized db

            // Generate or get visitor ID
            let visitorId = localStorage.getItem('alba_visitor_id');
            if (!visitorId) {
                visitorId = 'v_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('alba_visitor_id', visitorId);
            }

            const visitorRef = db.ref('visitors/' + visitorId);
            const sessionStart = Date.now();

            // Get device info
            function getDeviceInfo() {
                const ua = navigator.userAgent;
                let device = 'desktop';
                let browser = 'Unknown';
                let os = 'Unknown';
                let deviceModel = '';

                if (/Mobile|Android|iPhone|iPad/.test(ua)) {
                    device = /iPad|Tablet/.test(ua) ? 'tablet' : 'mobile';
                }

                if (ua.includes('Firefox')) browser = 'Firefox';
                else if (ua.includes('Edg')) browser = 'Edge';
                else if (ua.includes('Chrome')) browser = 'Chrome';
                else if (ua.includes('Safari')) browser = 'Safari';
                else if (ua.includes('Opera')) browser = 'Opera';

                if (ua.includes('Windows')) os = 'Windows';
                else if (ua.includes('Mac')) os = 'MacOS';
                else if (ua.includes('Linux') && !ua.includes('Android')) os = 'Linux';
                else if (ua.includes('Android')) os = 'Android';
                else if (ua.includes('iPhone')) os = 'iOS';
                else if (ua.includes('iPad')) os = 'iPadOS';

                // Extract device model from User Agent (works for Android)
                const androidMatch = ua.match(/Android[^;]*;\s*([^)]+)\)/);
                if (androidMatch) {
                    deviceModel = androidMatch[1].split(' Build')[0].trim();
                }
                // iPhone/iPad model detection (limited)
                if (ua.includes('iPhone')) deviceModel = 'iPhone';
                if (ua.includes('iPad')) deviceModel = 'iPad';

                // Additional device capabilities
                const deviceMemory = navigator.deviceMemory || null; // GB (Chrome only)
                const cpuCores = navigator.hardwareConcurrency || null;
                const maxTouchPoints = navigator.maxTouchPoints || 0;
                const isTouch = maxTouchPoints > 0;

                // Connection info
                let connectionType = 'Unknown';
                let connectionSpeed = null;
                if (navigator.connection) {
                    connectionType = navigator.connection.effectiveType || navigator.connection.type || 'Unknown';
                    connectionSpeed = navigator.connection.downlink || null; // Mbps
                }

                // Screen orientation
                const orientation = screen.orientation ? screen.orientation.type :
                    (window.innerHeight > window.innerWidth ? 'portrait' : 'landscape');

                return {
                    device,
                    browser,
                    os,
                    deviceModel: deviceModel || null,
                    deviceMemory,
                    cpuCores,
                    isTouch,
                    maxTouchPoints,
                    connectionType,
                    connectionSpeed,
                    orientation,
                    colorDepth: screen.colorDepth,
                    platform: navigator.platform
                };
            }

            // Get location via IP
            async function getLocation() {
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    const data = await response.json();
                    return {
                        country: data.country_name || 'Unknown',
                        countryCode: data.country_code || 'XX',
                        city: data.city || 'Unknown',
                        region: data.region || 'Unknown',
                        ip: data.ip || 'Unknown',
                        timezone: data.timezone || 'Unknown'
                    };
                } catch (e) {
                    return { country: 'Unknown', countryCode: 'XX', city: 'Unknown', region: 'Unknown', ip: 'Unknown', timezone: 'Unknown' };
                }
            }

            // Track visit
            async function trackVisit() {
                const deviceInfo = getDeviceInfo();
                const location = await getLocation();
                const now = Date.now();

                const snapshot = await visitorRef.once('value');
                const existingData = snapshot.val();

                if (existingData) {
                    await visitorRef.update({
                        lastVisit: now,
                        visitCount: (existingData.visitCount || 1) + 1,
                        ...location,
                        ...deviceInfo
                    });
                } else {
                    await visitorRef.set({
                        firstVisit: now,
                        lastVisit: now,
                        visitCount: 1,
                        totalDuration: 0,
                        ...location,
                        ...deviceInfo,
                        referrer: document.referrer || 'direct',
                        screenWidth: window.screen.width,
                        screenHeight: window.screen.height,
                        language: navigator.language
                    });
                }
            }

            // Update duration when user leaves
            async function updateDuration() {
                const sessionDuration = Date.now() - sessionStart;
                try {
                    const snapshot = await visitorRef.once('value');
                    const existingData = snapshot.val();
                    if (existingData) {
                        await visitorRef.update({
                            totalDuration: (existingData.totalDuration || 0) + sessionDuration,
                            lastVisit: Date.now()
                        });
                    }
                } catch (e) {}
            }

            // Track on page unload
            window.addEventListener('beforeunload', updateDuration);
            window.addEventListener('pagehide', updateDuration);

            // Also update periodically (every 30 seconds) in case browser closes abruptly
            setInterval(async () => {
                const sessionDuration = Date.now() - sessionStart;
                try {
                    const snapshot = await visitorRef.once('value');
                    const existingData = snapshot.val();
                    if (existingData) {
                        await visitorRef.update({
                            totalDuration: (existingData.totalDuration || 0) + 30000,
                            lastVisit: Date.now()
                        });
                    }
                } catch (e) {}
            }, 30000);

            trackVisit();

        } catch (e) {
            console.log('Analytics disabled');
        }
    })();
    </script>
</body>
</html>
